name: Refresh public submission states
on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-submission-refresh
  cancel-in-progress: false
jobs:
  submissions:
    if: github.repository == 'hraness/product-skills' && github.ref == 'refs/heads/main'
    runs-on: hraness-cf
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Observe only saved public submissions
        id: submissions
        continue-on-error: true
        env:
          GH_TOKEN: ''
          REPORT_GH_TOKEN: ''
        run: node scripts/submissions.mjs refresh
      - run: npm run check
      - name: Mint the dedicated repository installation token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: hraness
          repositories: product-skills
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
      - name: Propose checked submission records
        run: node scripts/automation.mjs propose-submissions
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DISTRIBUTION_APP_ID: ${{ vars.DISTRIBUTION_APP_ID }}
          DISTRIBUTION_APP_SLUG: ${{ steps.app.outputs.app-slug }}
      - name: Preserve the observation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: submission-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/submission-observation.json
          if-no-files-found: warn
          retention-days: 30
      - name: Require a completed public observation
        if: always()
        env:
          SUBMISSION_OUTCOME: ${{ steps.submissions.outcome }}
        run: |
          if [ "$SUBMISSION_OUTCOME" != success ]; then
            echo 'Public submission verification is pending. Earlier records and first dates are preserved.' >&2
            exit 1
          fi
