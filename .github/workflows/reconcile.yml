name: Reconcile products
on:
  schedule:
    - cron: '41 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'hraness/product-skills' && github.ref == 'refs/heads/main'
    runs-on: hraness-cf
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run reconcile
      - name: Observe skills.sh listing presence
        id: directories
        continue-on-error: true
        env:
          GH_TOKEN: ''
          REPORT_GH_TOKEN: ''
        run: node scripts/distribution.mjs record-directories
      - run: npm run check
      - name: Mint the dedicated repository installation token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: hraness
          repositories: product-skills
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
      - run: node scripts/automation.mjs propose-products
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DISTRIBUTION_APP_ID: ${{ vars.DISTRIBUTION_APP_ID }}
          DISTRIBUTION_APP_SLUG: ${{ steps.app.outputs.app-slug }}
      - name: Preserve the refresh report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reconcile-report.json
            dist/directory-observation.json
          if-no-files-found: warn
          retention-days: 30
      - name: Surface pending sources
        if: always()
        env:
          REPORT_GH_TOKEN: ${{ github.token }}
          REFRESH_FAILED: ${{ job.status == 'failure' }}
          DIRECTORY_OUTCOME: ${{ steps.directories.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          let pending = true;
          try { pending = process.env.REFRESH_FAILED === 'true' || process.env.DIRECTORY_OUTCOME !== 'success' || JSON.parse(await readFile('reconcile-report.json', 'utf8')).outcomes.some((r) => r.status === 'pending'); } catch {}
          if (pending) await writeFile('/tmp/product-refresh-issue.md', 'A public product source, listing icon, released runtime or skills.sh listing did not verify. The prior admitted packages and directory observations were preserved. Inspect the refresh reports; listing presence is separate from a publisher release or host approval.\n');
          NODE
          export GH_TOKEN="$REPORT_GH_TOKEN"
          if [ -f /tmp/product-refresh-issue.md ]; then
            PRODUCT_REFRESH_ISSUE=$(gh issue list --repo hraness/product-skills --state open --search 'in:title "Product package refresh needs attention"' --json number --jq '.[0].number // empty')
            if [ -z "$PRODUCT_REFRESH_ISSUE" ]; then
              gh issue create --repo hraness/product-skills --title 'Product package refresh needs attention' --body-file /tmp/product-refresh-issue.md
            fi
          fi
      - name: Require a completed directory observation
        if: always()
        env:
          DIRECTORY_OUTCOME: ${{ steps.directories.outcome }}
        run: |
          if [ "$DIRECTORY_OUTCOME" != success ]; then
            echo 'skills.sh listing verification is pending. Earlier directory observations and first verification dates are preserved.' >&2
            exit 1
          fi
