name: Publish checked packages
on:
  schedule:
    - cron: '57 14 * * *'
  workflow_run:
    workflows: [Check]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-publication
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'hraness/product-skills' &&
      github.repository_id == '1458031600' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.id == 1458031600 &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: hraness-cf
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/automation.mjs publish
      - name: Observe actual official MCP Registry publications
        id: registry
        continue-on-error: true
        env:
          GH_TOKEN: ''
          REPORT_GH_TOKEN: ''
        run: node scripts/distribution.mjs record-registry
      - name: Observe checked Homebrew publications
        id: homebrew
        continue-on-error: true
        env:
          GH_TOKEN: ''
          REPORT_GH_TOKEN: ''
        run: node scripts/distribution.mjs record-homebrew
      - name: Observe skills.sh listing presence
        id: directories
        continue-on-error: true
        env:
          GH_TOKEN: ''
          REPORT_GH_TOKEN: ''
        run: node scripts/distribution.mjs record-directories
      - name: Mint the dedicated token for the ledger pull request
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: hraness
          repositories: product-skills
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
      - name: Propose verified publication records
        run: node scripts/automation.mjs propose-publications
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DISTRIBUTION_APP_ID: ${{ vars.DISTRIBUTION_APP_ID }}
          DISTRIBUTION_APP_SLUG: ${{ steps.app.outputs.app-slug }}
      - name: Retain prepared archives
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: warn
          retention-days: 90
      - name: Require completed public observations
        if: always()
        env:
          REGISTRY_OUTCOME: ${{ steps.registry.outcome }}
          HOMEBREW_OUTCOME: ${{ steps.homebrew.outcome }}
          DIRECTORY_OUTCOME: ${{ steps.directories.outcome }}
        run: |
          if [ "$REGISTRY_OUTCOME" != success ] || [ "$HOMEBREW_OUTCOME" != success ] || [ "$DIRECTORY_OUTCOME" != success ]; then
            echo 'A public observation is pending. Earlier publication records and directory observations are preserved.' >&2
            exit 1
          fi
