name: Deliver checked updates
on:
  workflow_run:
    workflows: [Check]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: product-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'hraness/product-skills' && github.ref == 'refs/heads/main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success' && (startsWith(github.event.workflow_run.head_branch, 'automation/') || startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/'))
    runs-on: hraness-cf
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Mint the dedicated repository installation token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: hraness
          repositories: product-skills
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
      - run: node scripts/automation.mjs deliver
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPORT_GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_APP_ID: ${{ vars.DISTRIBUTION_APP_ID }}
          DISTRIBUTION_APP_SLUG: ${{ steps.app.outputs.app-slug }}
